name: New Chromium Source

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Chromium version tag to package'
        required: true
        default: '138.0.7204.303'

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

permissions:
  contents: write

jobs:
  new-chromium-source:
    name: New Chromium Source

    runs-on: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@v6

      - name: Prepare Chromium Sources
        shell: pwsh
        run: ./.scripts/New-ChromiumSource.ps1 -Version "${{ github.event.inputs.version }}"

      - name: Create GitHub Release
        run: |
          VERSION="${{ github.event.inputs.version }}"
          TAG="chromium-${VERSION}"
          FILE="chromium-${VERSION}-linux.tar.zst"
          
          if [ ! -f "$FILE" ]; then
            echo "Error: Tarball $FILE not found!"
            exit 1
          fi
          
          echo "Uploading $FILE to release $TAG..."
          # Create a release and upload the tarball as an asset
          gh release create "$TAG" "$FILE" \
            --title "Chromium $VERSION Source" \
            --notes "Automated Chromium source tarball for Thorium build (zstd long=31)." \
            || gh release upload "$TAG" "$FILE" --clobber
